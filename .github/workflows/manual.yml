# Workflow to ensure whenever a Github PR is submitted, 
# An issue ticket gets created automatically. 
name: AR
#Only read access to the contents of the repository is required for this workflow.
#In deploy job, rights are extended.
permissions:
  contents: read

# Controls when the action will run. On push to the main branch.
#Exept changes in .gitignore, README.md, CONTRIBUTING.md, and LICENSE.txt files. 
on:
  push:
    branches:
      - main
    paths-ignore:
      - '.gitignore'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE.txt'

  #  on pull request to the main branch.
  pull_request:
    types: [opened, reopened]
    branches:
      - main

  #on manual trigger(force deployment).
  workflow_dispatch:
#Older runs will be cancelled if a new run is triggered.
concurrency:
  group: 'AR'
  cancel-in-progress: true 

jobs:
  #test job:
  #Checkout repo
  #Setup Node
  #run linters and scripts to check for broken links.
  test:
    env:
      URL_CHECKER_TIMEOUT: ${{ vars.URL_CHECKER_TIMEOUT }}
    name: Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linters
      run: npm run lint:all

    - name: Run Scripts
      run: node script/url-checker.js -t ${{env.URL_CHECKER_TIMEOUT }}

#Build job:
#Precondition: test job must be successful.
#Checkout repo
#Setup page
#Using cache to install dependencies
#Using elevnty to build static pages.
#upload the built pages to github-pages artifact.(_site)
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@ba646f5fbd84f33cfadbeef917b7f096bcfebdfa

      - name: Setup Pages
        uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static pages
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2-)
          PATH_PREFIX="/$REPO_NAME/" npm run eleventy:prod

      - name: github-pages
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa 
        with:
          path: _site

#Deploy job:
#Precondition: test and build jobs must be successful.
#Download the built pages artifact.
#Deploy the built pages to github pages.
#Create an issue ticket with the deployment status and the URL of the deployed pages over GitHub CLI.
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [test, build]
   
    permissions:
      pages: write
      id-token: write
      issues: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download built site artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: github-pages
          path: _site-artifact

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

      - name: Create deployment status issue
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          

          DEPLOY_STATUS="failed"
          if [ "${{ steps.deployment.outcome }}" = "success" ]; then
            DEPLOY_STATUS="succeeded"
          fi

          TODAY=$(date +"%Y-%m-%d")
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2-)
          KB_URL="https://${{ github.repository_owner }}.github.io/$REPO_NAME/"

          gh issue create \
            --repo "${{ github.repository }}" \
            --title "$TODAY - Deployment: $DEPLOY_STATUS" \
            --body "URL: $KB_URL"

      - name: Fail workflow if deployment failed
        if: steps.deployment.outcome != 'success'
        run: exit 1

